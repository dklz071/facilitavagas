<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Facilita Vagas: pesquise oportunidades profissionais, filtre os resultados e salve suas vagas favoritas.">
  <title>Facilita Vagas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Facilita Vagas</h1>
    <p>Pesquise oportunidades, filtre os resultados e guarde as vagas que mais interessam.</p>
  </header>

  <main class="container">
    <section class="painel busca" aria-label="Busca e filtros">
      <div class="campo campo-busca">
        <label for="campo-busca">Buscar vaga</label>
        <input type="search" id="campo-busca" placeholder="Cargo, empresa, cidade ou tecnologia" autocomplete="off">
      </div>

      <div class="filtros">
        <div class="campo">
          <label for="filtro-modalidade">Modalidade</label>
          <select id="filtro-modalidade">
            <option value="todas">Todas</option>
            <option value="remoto">Remoto</option>
            <option value="presencial">Presencial</option>
          </select>
        </div>
        <div class="campo">
          <label for="filtro-tipo">Tipo de contrato</label>
          <select id="filtro-tipo"></select>
        </div>
        <div class="campo">
          <label for="filtro-tag">Tecnologia / área</label>
          <select id="filtro-tag"></select>
        </div>
        <div class="campo">
          <label for="ordenar">Ordenar por</label>
          <select id="ordenar">
            <option value="recentes">Mais recentes</option>
            <option value="titulo">Título (A-Z)</option>
            <option value="empresa">Empresa (A-Z)</option>
          </select>
        </div>
        <div class="campo campo-botao">
          <button type="button" id="limpar-filtros" class="btn btn-secundario">Limpar filtros</button>
        </div>
      </div>
    </section>

    <div class="abas" role="tablist" aria-label="Lista de vagas">
      <button type="button" id="aba-todas" class="aba ativa" role="tab" aria-selected="true">Todas as vagas</button>
      <button type="button" id="aba-favoritas" class="aba" role="tab" aria-selected="false">
        Favoritas <span id="contagem-favoritas" class="contagem">0</span>
      </button>
    </div>

    <div id="aviso-erro" class="aviso" role="alert" hidden>
      <span id="texto-erro"></span>
      <button type="button" id="tentar-novamente" class="btn btn-secundario btn-pequeno">Tentar novamente</button>
    </div>

    <p id="status" class="status" aria-live="polite"></p>

    <section id="lista-vagas" class="lista" aria-label="Resultados"></section>

    <p id="vazio" class="vazio" hidden>Nenhuma vaga encontrada com esses filtros.</p>

    <div class="mais">
      <button type="button" id="btn-mais" class="btn btn-primario" hidden>Mostrar mais</button>
    </div>
  </main>

  <dialog id="modal" aria-labelledby="modal-titulo">
    <article class="modal-conteudo">
      <button type="button" id="modal-fechar" class="modal-fechar" aria-label="Fechar">×</button>
      <h2 id="modal-titulo"></h2>
      <p id="modal-meta" class="modal-meta"></p>
      <div id="modal-badges" class="badges"></div>
      <div id="modal-descricao" class="modal-descricao"></div>
      <div class="modal-acoes">
        <a id="modal-aplicar" class="btn btn-primario" href="#" target="_blank" rel="noopener noreferrer">Ver vaga e candidatar-se</a>
        <button type="button" id="modal-fav" class="btn btn-secundario">☆ Favoritar</button>
      </div>
    </article>
  </dialog>

  <footer class="rodape">
    <p>Dados fornecidos pela API pública do <a href="https://www.arbeitnow.com" target="_blank" rel="noopener noreferrer">Arbeitnow</a>. As favoritas ficam salvas só no seu navegador.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
